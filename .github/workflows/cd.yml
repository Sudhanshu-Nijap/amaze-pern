name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            # Ensure the project directory exists
            if [ ! -d "~/amaze-pern" ]; then
              git clone https://github.com/${{ github.repository }}.git ~/amaze-pern
            fi

            cd ~/amaze-pern
            
            # Pull latest changes
            git pull origin main
            
            # Set up backend environment variables
            echo "PORT=5000" > backend/.env
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> backend/.env
            echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> backend/.env
            echo "SCRAPERAPI_KEY=${{ secrets.SCRAPERAPI_KEY }}" >> backend/.env
            
            # Set up frontend environment variables
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > frontend/.env
            echo "VITE_SUPABASE_KEY=${{ secrets.VITE_SUPABASE_KEY }}" >> frontend/.env
            echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> frontend/.env
            echo "VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}" >> frontend/.env

            # Export variables for frontend build context
            export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
            export VITE_SUPABASE_KEY="${{ secrets.VITE_SUPABASE_KEY }}"
            export VITE_API_URL="${{ secrets.VITE_API_URL }}"
            export VITE_SOCKET_URL="${{ secrets.VITE_SOCKET_URL }}"
            
            # Rebuild and restart the containers
            docker compose down
            docker compose build --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
                                 --build-arg VITE_SUPABASE_KEY="$VITE_SUPABASE_KEY" \
                                 --build-arg VITE_API_URL="$VITE_API_URL" \
                                 --build-arg VITE_SOCKET_URL="$VITE_SOCKET_URL"
            docker compose up -d
